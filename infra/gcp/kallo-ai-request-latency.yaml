name: kallo_ai_request_latency
description: Cloud Run request latency in seconds for POST /api/analyze-meal.
filter: >-
  resource.type="cloud_run_revision"
  AND resource.labels.service_name="kallo-prod"
  AND resource.labels.location="asia-southeast1"
  AND log_id("run.googleapis.com/requests")
  AND httpRequest.requestMethod="POST"
  AND httpRequest.requestUrl=~"/api/analyze-meal([?].*)?$"
valueExtractor: REGEXP_EXTRACT(httpRequest.latency, "([0-9.]+)s")
bucketOptions:
  exponentialBuckets:
    growthFactor: 2
    numFiniteBuckets: 18
    scale: 0.001
metricDescriptor:
  metricKind: DELTA
  valueType: DISTRIBUTION
  unit: s
