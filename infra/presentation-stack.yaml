AWSTemplateFormatVersion: '2010-09-09'
Description: Disposable ALB and ECS Fargate presentation tier for Kallo analytics.

Parameters:
  ImageUri:
    Type: String
    Description: Full ECR image URI for the linux/amd64 dashboard image.
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: Existing default VPC; this template deliberately creates no VPC.
  PublicSubnetIdOne:
    Type: AWS::EC2::Subnet::Id
    Description: First public subnet in the default VPC.
  PublicSubnetIdTwo:
    Type: AWS::EC2::Subnet::Id
    Description: Second public subnet in a different Availability Zone.
  DataStackName:
    Type: String
    Description: Deployed data-stack name whose API and secret exports are imported.
  SupabaseCredsSecretArn:
    Type: String
    Description: Existing data-stack secret ARN containing url, analytics_jwt, and api_key JSON keys.
  DashboardFounderUsername:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Founder username stored only in a disposable presentation secret.
  DashboardFounderPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Founder password stored only in a disposable presentation secret.
  DashboardReviewerUsername:
    Type: String
    NoEcho: true
    MinLength: 1
    Description: Reviewer username stored only in a disposable presentation secret.
  DashboardReviewerPassword:
    Type: String
    NoEcho: true
    MinLength: 12
    Description: Reviewer password stored only in a disposable presentation secret.
  DashboardSessionSecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Session-signing secret stored only in a disposable presentation secret.

Resources:
  # Public ALB security group exposes only the required HTTP demonstration port.
  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP access to the dashboard ALB.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Project
          Value: kallo-analytics

  # Service tasks accept HTTP only when the packet originates from the ALB group.
  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow dashboard traffic only from the presentation ALB.
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
      Tags:
        - Key: Project
          Value: kallo-analytics

  # Internet-facing ALB is session-only and is deleted with this disposable stack.
  DashboardLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetIdOne
        - !Ref PublicSubnetIdTwo
      Tags:
        - Key: Project
          Value: kallo-analytics

  # IP targets are required for Fargate tasks using awsvpc networking.
  DashboardTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      TargetType: ip
      Protocol: HTTP
      Port: 3000
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckPort: traffic-port
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: 200-399
      Tags:
        - Key: Project
          Value: kallo-analytics

  # Single HTTP listener forwards public requests to the one-task service.
  DashboardListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref DashboardLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref DashboardTargetGroup

  # Empty ECS cluster contains no capacity after the service is deleted.
  DashboardCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings:
        - Name: containerInsights
          Value: disabled
      Tags:
        - Key: Project
          Value: kallo-analytics

  # Short-retention logs aid a live defence and disappear when this stack is deleted.
  DashboardLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: kallo-analytics

  # These secrets are owned by the disposable stack and disappear with it.
  # Separate resources avoid serialising credential values into JSON strings.
  DashboardFounderUsernameSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Disposable founder username for the presentation dashboard.
      SecretString: !Ref DashboardFounderUsername
      Tags:
        - Key: Project
          Value: kallo-analytics
  DashboardFounderPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Disposable founder password for the presentation dashboard.
      SecretString: !Ref DashboardFounderPassword
      Tags:
        - Key: Project
          Value: kallo-analytics
  DashboardReviewerUsernameSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Disposable reviewer username for the presentation dashboard.
      SecretString: !Ref DashboardReviewerUsername
      Tags:
        - Key: Project
          Value: kallo-analytics
  DashboardReviewerPasswordSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Disposable reviewer password for the presentation dashboard.
      SecretString: !Ref DashboardReviewerPassword
      Tags:
        - Key: Project
          Value: kallo-analytics
  DashboardSessionSecretResource:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Disposable session-signing secret for the presentation dashboard.
      SecretString: !Ref DashboardSessionSecret
      Tags:
        - Key: Project
          Value: kallo-analytics

  # Smallest Fargate size and X86_64 match the locked image and lab cost ceiling.
  DashboardTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Cpu: '256'
      Memory: '512'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      TaskRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      ExecutionRoleArn: !Sub arn:aws:iam::${AWS::AccountId}:role/LabRole
      ContainerDefinitions:
        - Name: dashboard
          Essential: true
          Image: !Ref ImageUri
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: API_BASE_URL
              Value:
                Fn::ImportValue:
                  Fn::Sub: ${DataStackName}-ApiUrl
            # The classroom ALB has no certificate; Vercel keeps the secure default.
            - Name: DASHBOARD_COOKIE_SECURE
              Value: 'false'
          Secrets:
            - Name: DASHBOARD_TOKEN
              ValueFrom:
                Fn::ImportValue:
                  Fn::Sub: ${DataStackName}-DashboardTokenSecretArn
            - Name: DASHBOARD_FOUNDER_USERNAME
              ValueFrom: !Ref DashboardFounderUsernameSecret
            - Name: DASHBOARD_FOUNDER_PASSWORD
              ValueFrom: !Ref DashboardFounderPasswordSecret
            - Name: DASHBOARD_REVIEWER_USERNAME
              ValueFrom: !Ref DashboardReviewerUsernameSecret
            - Name: DASHBOARD_REVIEWER_PASSWORD
              ValueFrom: !Ref DashboardReviewerPasswordSecret
            - Name: DASHBOARD_SESSION_SECRET
              ValueFrom: !Ref DashboardSessionSecretResource
            - Name: SUPABASE_URL
              ValueFrom: !Sub '${SupabaseCredsSecretArn}:url::'
            - Name: SUPABASE_ANALYTICS_JWT
              ValueFrom: !Sub '${SupabaseCredsSecretArn}:analytics_jwt::'
            - Name: SUPABASE_PUBLISHABLE_KEY
              ValueFrom: !Sub '${SupabaseCredsSecretArn}:api_key::'
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref DashboardLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: dashboard
      Tags:
        - Key: Project
          Value: kallo-analytics

  # One public-IP task avoids NAT cost; its ingress remains restricted to the ALB.
  DashboardService:
    Type: AWS::ECS::Service
    DependsOn: DashboardListener
    Properties:
      Cluster: !Ref DashboardCluster
      TaskDefinition: !Ref DashboardTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      PlatformVersion: LATEST
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MaximumPercent: 200
        MinimumHealthyPercent: 0
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          SecurityGroups:
            - !Ref ServiceSecurityGroup
          Subnets:
            - !Ref PublicSubnetIdOne
            - !Ref PublicSubnetIdTwo
      LoadBalancers:
        - ContainerName: dashboard
          ContainerPort: 3000
          TargetGroupArn: !Ref DashboardTargetGroup
      Tags:
        - Key: Project
          Value: kallo-analytics

Outputs:
  LoadBalancerDnsName:
    Description: Public DNS name of the disposable dashboard ALB.
    Value: !GetAtt DashboardLoadBalancer.DNSName
